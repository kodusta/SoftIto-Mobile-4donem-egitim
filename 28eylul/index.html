        // Rest Api olarak Dışardan Veri Çekme

        const kozmetikUrunleriniGetir = async () => {
            try {
                console.log("Harici Apiye Bağlanılıyor");
                const response = await fetch("https://dummyjson.com/products/category/beauty");

                if (!response.ok) {
                    throw new Error(`Http Hatası: ${response.status}`);
                }

                const data = await response.json();
                console.log(`Toplam ${data.products.length} adet kozmetik ürün çekildi`);

                const vitrin = data.products.slice(0, 3).map(p => ({
                    urun: p.title,
                    fiyat: p.price,
                    stok: p.stock
                }));
                console.table(vitrin);
            } catch (err) {
                console.warn("Api Hatası", err.message);
            }
