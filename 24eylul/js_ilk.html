//Meydan Okuma konusu şarj süresi tahmin dakika cinsinden
verilecek değerler 
mevcut yüzde
hedef yüzde
bataryaKW
istasyonKW


 */


const sarjSuresiTahmin = (mevcutYuzde,hedefYuzde,bataryaKwh,istasyonKw,aracSarjWattDakika) => {
  if (mevcutYuzde >= hedefYuzde) return 0;
  const doldurulacakYuzde = hedefYuzde - mevcutYuzde;
   const gerekenKwh = bataryaKwh * (doldurulacakYuzde / 100);
  const aracKw = (aracSarjWattDakika * 60) / 1000;
  const efektifKw = Math.min(aracKw, istasyonKw);
  const saat = gerekenKwh / efektifKw;
  const dakika = Math.ceil(saat * 60);
  return dakika;
};

console.log(
  "Tesla:",
  sarjSuresiTahmin(20, 80, 75, 180, 1000),
  "Dakika"
);

console.log(
  "Togg T10X:",
  sarjSuresiTahmin(20, 80, 88.5, 180, 800),
  "Dakika"
);


// Fiyat Hesaplama
const sarjHesapla1 = (
  mevcutYuzde,
  hedefYuzde,
  bataryaKwh,
  istasyonKw,
  aracSarjWattDakika,
  kwhFiyat
) => {
  if (mevcutYuzde >= hedefYuzde) {
    return {
      dakika: 0,
      gerekenKwh: 0,
      toplamTutar: 0
    };
  }

  const doldurulacakYuzde = hedefYuzde - mevcutYuzde;
  const gerekenKwh = bataryaKwh * (doldurulacakYuzde / 100);
  const aracKw = (aracSarjWattDakika * 60) / 1000;
  const efektifKw = Math.min(aracKw, istasyonKw);
  const dakika = Math.ceil((gerekenKwh / efektifKw) * 60);
  const toplamTutar = gerekenKwh * kwhFiyat;

  return {
    dakika,
    gerekenKwh: Number(gerekenKwh.toFixed(2)),
    toplamTutar: Number(toplamTutar.toFixed(2))
  };
};

console.log(

);

//Gece Gündüz Tarifesi
const sarjHesapla2 = (
  mevcutYuzde,
  hedefYuzde,
  bataryaKwh,
  istasyonKw,
  aracSarjWattDakika,
  gunduzKwhFiyat,
  geceKwhFiyat,
  tarife
) => {
  if (mevcutYuzde >= hedefYuzde) {
    return {
      dakika: 0,
      gerekenKwh: 0,
      toplamTutar: 0,
      tarife
    };
  }

  const doldurulacakYuzde = hedefYuzde - mevcutYuzde;
  const gerekenKwh = bataryaKwh * (doldurulacakYuzde / 100);
  const aracKw = (aracSarjWattDakika * 60) / 1000;
  const efektifKw = Math.min(aracKw, istasyonKw);
  const dakika = Math.ceil((gerekenKwh / efektifKw) * 60);

  const kwhFiyat = tarife === "gece"
    ? geceKwhFiyat
    : gunduzKwhFiyat;

  const toplamTutar = gerekenKwh * kwhFiyat;

  return {
    dakika,
    gerekenKwh: Number(gerekenKwh.toFixed(2)),
    kwhFiyat,
    toplamTutar: Number(toplamTutar.toFixed(2)),
    tarife
  };
};

);
