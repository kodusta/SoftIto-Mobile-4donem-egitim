<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline-first Taslak & Sepet Depolama</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f8fafc;
            box-shadow: 0;
            color: #1e293b;
            padding: 24px;
            max-width: 520px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 6px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1.5px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            background: #e0f2fe;
            color: #0369a1;
            margin-bottom: 12px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-submit {
            background: darkgreen;
            color: white;
        }

        .btn-clear {
            background: darkred;
            color: white
        }

        .status-msg {
            font-size: 12px;
            color: #10b981;
            margin-top: 8px;
            font-weight: 600;
            min-height: 18px;
        }
    </style>
</head>

<body>

    <div class="card">
        <span class="badge">Otomatik offline kayıt aktif</span>
        <h3>Müşteri Arıza & Destek Kayıt Formu</h3>
        <p style="font-size: 12px;color:#64748b;margin-bottom: 16px;">Tarayıcıyı kapatsanız bile bunlar kayıt olarak
            kalacaktır</p>

        <form id="supportForm">
            <div class="form-group">
                <label for="txtName">Müşteri Ad Soyad:</label>
                <input type="text" id="txtName" name="name" placeholder="Ahmet yılmaz">
            </div>
            <div class="form-group">
                <label for="txtDevice">Cihaz modeli & Seri No:</label>
                <input type="text" name="device" id="txtDevice" placeholder="İphone 18 Pro Max & AAS651461">
            </div>
            <div class="form-group">
                <label for="txtDesc">Arıza Detayı:</label>
                <textarea id="txtDesc" name="desc" rows="4"
                    placeholder="Cihazınızın arızasını detaylandırın"></textarea>
            </div>
            <div class="status-msg" id="statusLog"></div>

            <div class="btn-group">
                <button type="submit" class="btn-submit">Kaydı Tamamla</button>
                <button type="button" id="btnClear" class="btn-clear">Taslağı Sıfırla</button>
            </div>

        </form>




    </div>


    <script>
        const STORAGE_KEY = 'selahaddin_support_softito';
        const form = document.getElementById('supportForm');
        const nameInput = document.getElementById('txtName');
        const deviceInput = document.getElementById('txtDevice');
        const descInput = document.getElementById('txtDesc');
        const statusLog = document.getElementById('statusLog');
        const btnClear = document.getElementById('btnClear');


        //1. Sayfa Açıldığında LocalStorage'den Taslağı Geri Getir
        window.addEventListener('DOMContentLoaded', () => {
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                try {
                    const draft = JSON.parse(savedData);
                    nameInput.value = draft.name || "";
                    deviceInput.value = draft.device || "";
                    descInput.value = draft.desc || "";
                    statusLog.innerText = `Önceki Taslak Geri Yüklendi (${draft.lastSaved})`;
                } catch (e) {
                    console.error("Taslak parse hatası:", e)
                }
            }
        })

        //2.Formdaki her bir girişi JSON olarak LocalStorage' yaz
        form.addEventListener('input', () => {
            const draftData = {
                name: nameInput.value,
                device: deviceInput.value,
                desc: descInput.value,
                lastSaved: new Date().toLocaleTimeString('tr-TR')
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(draftData));
            statusLog.innerText = `Taslak Otomatik Olarak Kaydedildi: ${draftData.lastSaved}`;
        });

        //3.Form gönderildiğinde başarılı mesajı verip taslağı temizlemek
        form.addEventListener('submit', () => {
            e.preventDefault();
            alert('destek talebiniz başarıyla merkeze iletildi');
            localStorage.removeItem(STORAGE_KEY);
            form.reset();
            statusLog.innerText('Form temizlendi,taslak silindi.')
        });
        //4.Taslağı manuel olarak temizleme
        btnClear.addEventListener('click', () => {
            if (confirm('Taslağı silmek istediğinize emin misiniz?')) {
                localStorage.removeItem(STORAGE_KEY);
                form.reset();
                statusLog.innerText = 'Taslak Silindi';
            }
        });
        //5.Çoklu seçme Sihirli Senkronizasyonu
        window.addEventListener('storage', (event) => {
            if (event.key === STORAGE_KEY && event.newValue) {
                const remoteDraft = JSON.parse(event.newValue);
                nameInput.value = remoteDraft.name || "";
                deviceInput.value = remoteDraft.device || "";
                descInput.value = remoteDraft.desc || "";
                statusLog.innerText = `Diğer Sekmeden Güncellendi 
                ${remoteDraft.lastSaved}`;

            }
        });







    </script>


</body>

</html>
