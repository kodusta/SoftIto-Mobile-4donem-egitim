<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İframe</title>
    <style>
        body{
            font-family: 'Courier New', Courier, monospace;
            background: khaki;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        .card{
            background-color: blueviolet;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 52px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        h3{
            margin-top: 0;;
            color: #1e293b;
        }
        iframe{
            width: 100%;
            border-radius: 8px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>İframe Harita ve video</h3>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/IYs0zCE55OI?si=7CeVcHsvdD8iqAs-" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <br>
        <iframe src="https://kodusta.com" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
</body>
</html>
